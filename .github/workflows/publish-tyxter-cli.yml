name: Publish Tyxter CLI

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/tyxter/tyxter-cli

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  publish-npm:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Validate release tag and package version
        id: release
        run: node scripts/release-metadata.mjs
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm install --global npm@12.2.0
      - run: npm install --global --allow-scripts=pnpm pnpm@12.14.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:package
      - name: Publish npm packages with trusted publishing and provenance
        env:
          STABLE_RELEASE: ${{ steps.release.outputs.stable }}
        shell: bash
        run: |
          npm_tag=next
          if [[ "$STABLE_RELEASE" == "true" ]]; then
            npm_tag=latest
          fi
          # Publish the dependency first. Existing versions are safe to skip on
          # reruns, including the one-time token-authenticated bootstrap release.
          for package_dir in . packages/tyxter-cli; do
            name=$(node -p "require('./$package_dir/package.json').name")
            version=$(node -p "require('./$package_dir/package.json').version")
            if npm view "$name@$version" version --json > "$RUNNER_TEMP/npm-version.json"; then
              echo "$name@$version already published"
            elif jq -e '.error.code == "E404"' "$RUNNER_TEMP/npm-version.json" > /dev/null; then
              (cd "$package_dir" && npm publish --ignore-scripts --access public --provenance --tag "$npm_tag")
            else
              echo "Unable to check $name@$version on npm"
              exit 1
            fi
          done

  publish:
    needs: [validate, publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Validate release tag and package version
        id: release
        run: node scripts/release-metadata.mjs
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ steps.release.outputs.stable == 'true' }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          STABLE_RELEASE: ${{ steps.release.outputs.stable }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists"
            exit 0
          fi
          notes_file="$RUNNER_TEMP/release-notes.md"
          printf 'npm: `npx @tyxter/cli@%s --help` (also `npx tyxter-cli@%s --help`).\n\n' \
            "${RELEASE_TAG#v}" "${RELEASE_TAG#v}" > "$notes_file"
          printf 'Container image: `%s:%s` (linux/amd64 and linux/arm64).\n' \
            "$IMAGE_NAME" "$RELEASE_TAG" >> "$notes_file"
          flags=(--latest=false --prerelease)
          if [[ "$STABLE_RELEASE" == "true" ]]; then
            flags=(--latest)
          fi
          gh release create "$RELEASE_TAG" --verify-tag \
            --title "Tyxter CLI $RELEASE_TAG" --generate-notes \
            --notes-file "$notes_file" "${flags[@]}"
